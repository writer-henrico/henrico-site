name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar o site
        run: |
          FILE=$(find . -name build.js -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$FILE" ]; then echo "build.js nao encontrado no repositorio"; exit 1; fi
          DIR=$(dirname "$FILE")
          echo "Pasta do site: $DIR"
          cd "$DIR"
          node build.js
          echo "SITE_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
